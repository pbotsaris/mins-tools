<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mamãe Mins — teste de interface</title><style>body{font:16px system-ui;background:#edf3f5;color:#23353b;margin:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{padding:10px;min-height:44px}iframe{background:white;border:1px solid #b5cbd1;border-radius:14px;width:min(100%,680px);height:850px;display:block}p{max-width:680px}</style><h1>Teste de interface — dados fictícios</h1><p>Host MCP simulado. Os cliques salvam apenas na memória do servidor de teste; não são registros reais nem teste do aplicativo Android.</p><nav><button id="list">Reabrir lista</button><button id="journal">Cartão de diário</button><button id="failure">Alternar falha de salvamento</button><button id="mobile">Largura 360 px</button></nav><p id="host-status" role="status"></p><iframe id="app" src="/app" title="Checklist Mamãe Mins"></iframe>
<script>
const frame=document.getElementById('app');let ready=false,seq=0;
async function tool(name,args={}){const response=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++seq,method:'tools/call',params:{name,arguments:args}})});return(await response.json()).result}
function emit(params){frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params},location.origin)}
window.addEventListener('message',async e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;const m=e.data;if(m.method==='ui/initialize')frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'fixture-host',version:'1.0.0'},hostCapabilities:{serverTools:{}},hostContext:{displayMode:'inline'}}},location.origin);if(m.method==='ui/notifications/initialized'){ready=true;emit(await tool('open_list',{listId:'lista-demo'}))}if(m.method==='tools/call'){const result=await tool(m.params.name,m.params.arguments);frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result},location.origin)}});
document.getElementById('list').onclick=async()=>emit(await tool('open_list',{listId:'lista-demo'}));document.getElementById('journal').onclick=async()=>emit(await tool('open_diary'));
document.getElementById('failure').onclick=async()=>{const r=await(await fetch('/fixture/fail',{method:'POST'})).json();document.getElementById('host-status').textContent=r.failure?'Falha simulada ativada.':'Falha simulada desativada.'};document.getElementById('mobile').onclick=()=>{frame.style.width='360px';frame.style.maxWidth='100%'};
</script></html>
